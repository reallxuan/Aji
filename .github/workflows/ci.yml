name: CI

on:
  push:
  pull_request:
  # Actions → CI → Run workflow builds installers for any branch on demand.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its installers; other branches only need their latest run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-npm-licenses.mjs

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also regenerates src/transport/generated through ts-rs.
      - run: cargo test --workspace
      - name: Generated TypeScript bindings are up to date
        run: |
          git diff --exit-code -- src/transport/generated
          test -z "$(git status --porcelain -- src/transport/generated)"

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  bundle:
    # Installers are slow to build, so only for pushes to main or a manual run.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [frontend, rust, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: aji-windows-x64
          # macos-15 is arm64; the macos-14 label is now an x64 image and deprecated.
          - os: macos-15
            bundle: dmg
            artifact: aji-macos-arm64
          # The oldest supported glibc. When this label is retired, build in an ubuntu:22.04
          # container on ubuntu-24.04 instead.
          - os: ubuntu-22.04
            bundle: appimage
            artifact: aji-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/${{ matrix.bundle }}/*
          retention-days: 14
          if-no-files-found: error
