[package]
name = "aji"
description = "A graphical interface for KataGo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which otherwise collides on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "aji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aji-core = { path = "../crates/aji-core" }
aji-engine = { path = "../crates/aji-engine" }
aji-manager = { path = "../crates/aji-manager" }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.27.0"
