[package]
name = "aji-manager"
description = "Aji's engine manager: the install manifest, hardware detection and network benchmarking"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aji-core = { path = "../aji-core" }
aji-engine = { path = "../aji-engine" }
semver = { version = "1", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
md-5 = "0.11"
tokio-util = "0.7"
ts-rs = "12.0.1"
minisign-verify = "0.3.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

# The fake KataGo, built here too so this package's tests get
# `CARGO_BIN_EXE_aji-manager-fake-katago`.
[[bin]]
name = "aji-manager-fake-katago"
path = "../aji-engine/src/bin/fake-katago.rs"
test = false
doc = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }

[dev-dependencies]
ct-codecs = "1"
minisign = "0.10"
ring = "0.17"
tempfile = "3.27.0"
