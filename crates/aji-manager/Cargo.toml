[package]
name = "aji-manager"
description = "Aji's engine manager: the install manifest, hardware detection and network benchmarking"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
minisign-verify = "0.3.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
minisign = "0.10"
tempfile = "3.27.0"
