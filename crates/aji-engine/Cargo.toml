[package]
name = "aji-engine"
description = "Runs KataGo's analysis engine: queries, response parsing, throttling, caching and the process watchdog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aji-core = { path = "../aji-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
ts-rs = "12.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

# `Win32_Security` is needed because `CreateJobObjectW` takes a `SECURITY_ATTRIBUTES` pointer.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
# Hooks the integration tests use to imitate a stuck process. Never enabled in a build of Aji.
test-seams = []

[dev-dependencies]
# Turns the test seams on for this crate's own tests.
aji-engine = { path = ".", features = ["test-seams"] }
tempfile = "3.27.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
