[package]
name = "aji-manifest-tool"
description = "Generates and checks Aji's install manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "aji_manifest_tool"
path = "src/lib.rs"

[[bin]]
name = "aji-manifest"
path = "src/main.rs"

[dependencies]
aji-manager = { path = "../aji-manager" }
minisign-verify = "0.3.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
scraper = "0.29"
sha2 = "0.11"
semver = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
